[project]
name = "calibration-probe"
version = "0.1.0"
description = "Does a System One decision model's confidence drop when it should? A 48-item probe for SemIf, Jev and an LLM baseline."
authors = [
    { name = "Andre Lim", email = "andre.lim@langchain.dev" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.0,<2.0",
    "langchain-typesafe>=0.0.1a3",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
calibration-probe = "calibration_probe.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
